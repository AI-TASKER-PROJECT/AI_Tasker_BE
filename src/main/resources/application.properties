# Mục đích note: mô tả vai trò file cấu hình/script, không note rải vào từng khai báo.
spring.application.name=aitasker
server.port=8080

spring.config.import=optional:file:.env[.properties],optional:file:.env.docker[.properties],optional:file:.env.supabase[.properties]

app.jwt.secret=${APP_JWT_SECRET:8WVkg9Zpwj4NMwCM5PUn+WL9EhUFc1ffvOnTd5P2SMZriHPMdKoX2A1uLY+xYDSCZvJLEj4t8vg8SOdrd4SNBg==}
