# NOTE FILE: src/main/resources/application.properties
# Đây là file gì: File cấu hình runtime của Spring Boot, khai báo database, bảo mật, migration và môi trường chạy.
# Mục đích note: mô tả vai trò file cấu hình/script, không note rải vào từng khai báo.
spring.application.name=aitasker
server.port=${SERVER_PORT:8080}

spring.config.import=optional:file:.env[.properties],optional:file:.env.docker[.properties],optional:file:.env.supabase[.properties]

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-expiration-ms=${APP_JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?options=-c%20TimeZone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}

# vut vao day nha huy
openai.api.key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.responses-url=${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:700}


# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
