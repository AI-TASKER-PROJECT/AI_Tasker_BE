# NOTE FILE: src/main/resources/application.properties
# Đây là file gì: File cấu hình runtime của Spring Boot, khai báo database, bảo mật, migration và môi trường chạy.
# Mục đích note: mô tả vai trò file cấu hình/script, không note rải vào từng khai báo.
spring.application.name=aitasker
server.port=${SERVER_PORT:8080}

spring.config.import=optional:file:.env[.properties]

app.jwt.secret=${APP_JWT_SECRET:8WVkg9Zpwj4NMwCM5PUn+WL9EhUFc1ffvOnTd5P2SMZriHPMdKoX2A1uLY+xYDSCZvJLEj4t8vg8SOdrd4SNBg==}
app.jwt.access-expiration-ms=${APP_JWT_ACCESS_EXPIRATION_MS:10800000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:aitasker_db}?options=-c%20TimeZone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:aitasker}
spring.datasource.password=${DB_PASSWORD:aitasker123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:10MB}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# vut vao day nha huy
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.responses-url=${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}
openai.embeddings-url=${OPENAI_EMBEDDINGS_URL:https://api.openai.com/v1/embeddings}
openai.chat-completions-url=${OPENAI_CHAT_COMPLETIONS_URL:https://api.openai.com/v1/chat/completions}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:700}
openai.sow.rag.enabled=true

rag.top-k=${RAG_TOP_K:5}
rag.search-threshold=${RAG_SEARCH_THRESHOLD:0.65}
rag.ingest-on-startup=${RAG_INGEST_ON_STARTUP:false}


# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# payOS
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=${PAYOS_RETURN_URL}
payos.cancel-url=${PAYOS_CANCEL_URL}

# Firebase Storage
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}

# Google Sign-In
google.client-id=${GOOGLE_CLIENT_ID:}

# Auth lockout and password reset
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.password-reset-token-ttl-minutes=${APP_PASSWORD_RESET_TOKEN_TTL_MINUTES:15}
app.password-reset-rate-limit-seconds=${APP_PASSWORD_RESET_RATE_LIMIT_SECONDS:60}
app.login-temporary-lock-minutes=${APP_LOGIN_TEMPORARY_LOCK_MINUTES:5}
app.login-failed-attempt-threshold=${APP_LOGIN_FAILED_ATTEMPT_THRESHOLD:5}
