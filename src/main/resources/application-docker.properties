# NOTE FILE: src/main/resources/application-docker.properties
# Đây là file gì: File cấu hình runtime của Spring Boot, khai báo database, bảo mật, migration và môi trường chạy.
# Mục đích note: mô tả vai trò file cấu hình/script, không note rải vào từng khai báo.
spring.application.name=aitasker
server.port=8080

spring.config.import=optional:file:.env[.properties]

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?options=-c%20TimeZone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

