# NOTE FILE: src/main/resources/application.properties
# Đây là file gì: File cấu hình runtime của Spring Boot, khai báo database, bảo mật, migration và môi trường chạy.
# Mục đích note: mô tả vai trò file cấu hình/script, không note rải vào từng khai báo.
# Ép buộc Spring Boot log ra URL mà nó thực sự dùng để kết nối
logging.level.org.springframework.jdbc.datasource=DEBUG
spring.application.name=aitasker
server.port=${SERVER_PORT}
 
spring.config.import=optional:file:.env[.properties]

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-expiration-ms=${APP_JWT_ACCESS_EXPIRATION_MS}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS}

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:aitasker_db}?options=-c%20TimeZone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

#FB Setting
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:10MB}

#Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-migration-patterns=*:missing

#Swagger
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

#Google
google.client-id=${GOOGLE_CLIENT_ID}

#Open AI
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.responses-url=${OPENAI_RESPONSES_URL}
openai.embeddings-url=${OPENAI_EMBEDDINGS_URL}
openai.chat-completions-url=${OPENAI_CHAT_COMPLETIONS_URL}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:700}
openai.sow.rag.enabled=true

rag.top-k=${RAG_TOP_K:5}
rag.search-threshold=${RAG_SEARCH_THRESHOLD:0.65}
rag.ingest-on-startup=${RAG_INGEST_ON_STARTUP:false}


# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=aitaskerteam1@gmail.com
spring.mail.password=dwpm tvgq yske uirq
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# PayOS
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=${PAYOS_RETURN_URL}
payos.cancel-url=${PAYOS_CANCEL_URL}

# Firebase Storage is disabled in tests unless a test opts in explicitly.
firebase.service-account-path=
firebase.storage-bucket=
