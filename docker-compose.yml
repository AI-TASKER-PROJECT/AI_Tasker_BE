# NOTE FILE: docker-compose.yml
# Đây là file gì: File Docker Compose khai báo dịch vụ hạ tầng cần chạy cùng back-end.
# Mục đích note: mô tả vai trò file cấu hình/script, không note rải vào từng khai báo.
services:
  postgres:
    image: postgres:16
    container_name: aitasker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aitasker_db
      POSTGRES_USER: aitasker
      POSTGRES_PASSWORD: aitasker123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: