services:
  postgres:
    image: postgres:16
    container_name: aitasker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aitasker_db
      POSTGRES_USER: aitasker
      POSTGRES_PASSWORD: aitasker123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-otp
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
